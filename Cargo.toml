[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jarvis-jhk/rounds-port"

[workspace.dependencies]
unity-assets = { path = "crates/unity" }
rounds-import = { path = "crates/import" }
rounds-sim = { path = "crates/sim" }
rounds-render = { path = "crates/render" }
rounds-net = { path = "crates/net" }
rounds-content = { path = "crates/content" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
glam = { version = "0.30", features = ["serde"] }
# rounds-sim
libm = "0.2"
rapier2d = { version = "0.36", features = ["enhanced-determinism"] }
# rounds-net
ggrs = "0.13"
bincode = "1.3"
# bytemuck: shared with crates/render (below)
warpzone-core = { git = "https://github.com/jarvis-jhk/warpzone", rev = "c967f5c1b2f7c41ff66d4c16e7b4197440beee8b" }
memmap2 = "0.9"
rayon = "1"
tiny-skia = "0.11"
# Platform + renderer (crates/render, crates/game).
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "dx12", "metal", "gles", "parking_lot"] }
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
png = "0.18"
pollster = "1"
sdl2 = { version = "0.38", features = ["raw-window-handle"] }
lewton = "0.10"
raw-window-handle = "0.6"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
