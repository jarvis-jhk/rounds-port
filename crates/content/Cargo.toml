[package]
name = "rounds-content"
description = "Converts imported ROUNDS data (rounds-import) into simulation content (rounds-sim)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "content-check"
path = "src/bin/content-check.rs"

[[bin]]
name = "sim-sheet"
path = "src/bin/sim-sheet.rs"

[dependencies]
rounds-import = { workspace = true }
rounds-sim = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tiny-skia = { workspace = true }
rayon = { workspace = true }
